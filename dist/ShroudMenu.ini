; ShroudMenu 1.0.0 by shrouddeath - settings
; Changes take effect the next time the game starts. Settings changed in the
; in-game menu are stored in ShroudMenu.state and override the values here.

[General]
; 1 = mod on, 0 = completely off
Enabled=1
; Radius around the player in which NPCs are affected (10-150 metres)
Radius=60
; How often the NPCs around you are scanned, in milliseconds (min 100)
ScanIntervalMs=500
; Small status line in the lower left corner
ShowOverlay=1
; 0 = quiet, 1 = normal, 2 = debug (every speech line and ragdoll goes to ShroudMenu.log)
LogLevel=1

[Keys]
; F1-F24, Up/Down/Left/Right, Enter, Backspace, Numpad0-9, Home, End, PageUp, PageDown,
; Insert, Delete, a single letter or digit, or a virtual key code (0x75).
; F5 is used by the Native Trainer and Rampage, F8 by ScriptHookRDR2 .NET.
Menu=F6
Up=Numpad8
Down=Numpad2
Left=Numpad4
Right=Numpad6
Select=Numpad5
Back=Numpad0
; Arrow keys, Enter and Backspace always work as well while the menu is open.

[Filter]
; 1 = animals are affected too (Panic mode and glass jaw only)
IncludeAnimals=0
; 1 = lawmen, soldiers, Pinkertons and guards are left alone
ExcludeLawmen=1

[Drunk]
; 0 = slightly, 1 = moderately, 2 = very drunk (_SET_PED_DRUNKNESS 0.25 / 0.5 / 1.0)
Level=2
; 1 = every now and then they stumble and fall (short ragdoll)
Stumble=1
StumbleMinSec=10
StumbleMaxSec=25
StumbleMinMs=700
StumbleMaxMs=1400
; ragdoll type passed to SET_PED_TO_RAGDOLL (0 = default)
StumbleRagdollType=0
; 1 = drunk babbling
Speech=1
SpeechMinSec=10
SpeechMaxSec=30
; speech parameter set: force, force_shouted_critical, force_shouted_clear, beat_shouted_clear,
; standard, shouted, force_normal, force_normal_clear, lms (community value), or a 0x hash
SpeechParams=force_shouted_critical
Lines=DRUNK,DRUNK,DRUNK,GENERIC_CURSE_MED,CHALLENGE_THREATEN_DRUNK
; experimental: also set the DRUNK motivation state
UseMotivation=0

[Insult]
; NPCs within this distance (metres) and with a clear line of sight insult you
DistanceM=12
; pause per NPC between two insults, random between min and max seconds
MinSec=6
MaxSec=15
; 1 = they look at you / turn to you before speaking
FaceTarget=1
NeedLineOfSight=1
SpeechParams=force
Lines=GENERIC_INSULT_HIGH,GENERIC_INSULT_HIGH,GENERIC_INSULT_MED,GENERIC_CURSE_HIGH,GENERIC_CURSE_MED,GET_LOST,WHATS_YOUR_PROBLEM,CHALLENGE_THREATEN,CIVILIAN_TAUNT_MED,GENERIC_ANGRY_SHOUT,DISMISSIVE_REACT_ANNOYED

[Aggressive]
; 1 = unarmed NPCs get a weapon from the list below (otherwise they brawl)
GiveWeapons=0
Weapons=WEAPON_MELEE_KNIFE,WEAPON_REVOLVER_CATTLEMAN
; 0-100, how well they shoot
Accuracy=15
; seconds before an NPC that stopped fighting is sent at you again
RetaskSec=4
; 1 = the law does not respond while Aggressive mode is on
DisableLaw=0

[GlassJaw]
; how long they stay down after a hit, milliseconds
RagdollMinMs=1500
RagdollMaxMs=2500
RagdollType=0
; shove away from the player when hit
PushForce=6
; 1 = health is refilled on every hit, so nobody is knocked out or killed while glass jaw is on
HealAfterHit=1
; 1 = walking into an NPC is enough to drop them
BumpTrigger=0
; 1 = they do not fight back or react, they just fall and get up again
NoRetaliation=0

[Panic]
Speech=1
MinSec=5
MaxSec=12
SpeechParams=force_shouted_critical
; flee speed (R* scripts use 3.0) and flee type (eFleeStyle, 0 = default)
Speed=3.0
FleeType=0
Lines=PANIC_HELP,SCARED_HELP,GENERIC_FRIGHTENED_HIGH,GENERIC_SHOCKED_HIGH,PLEAD,SCREAM_TERROR,SCREAM_SHOCKED,GUN_RUN

; ---------------------------------------------------------------------------
; Experimental modes (Robbery, Lasso)
; ---------------------------------------------------------------------------
[Robbery]
; robber and victim must be this close (metres)
DistanceM=12
; how long the hands stay up before the money changes hands
HoldupSec=5
; pause per NPC before the next robbery, random between min and max seconds
CooldownMinSec=8
CooldownMaxSec=20
Weapon=WEAPON_REVOLVER_CATTLEMAN
SpeechParams=force
RobberLines=CHALLENGE_THREATEN_ARMED,CHALLENGE_THREATEN,GENERIC_CURSE_HIGH
VictimLines=HANDS_UP,HOLDUP_DONT_SHOOT,HOLDUP_DONT_KILL_ME,PLEAD,INTIMIDATED_ROB
HandOverLines=HAND_OVER_MONEY,HOLDUP_GIVE_CASH,PLEAD
FleeLines=HOLDUP_RUN,HOLDUP_HELP,PANIC_HELP

[Lasso]
; a target is picked within this range (metres) ...
DistanceM=15
; ... and the thrower walks up to this range before throwing
ThrowDistanceM=7
; 1 = hogtie the catch, 0 = just lasso and let go
Hogtie=1
; seconds the catch stays hogtied before it breaks free
HogtieHoldSec=6
; give up after this many seconds without a catch
TimeoutSec=20
CooldownMinSec=5
CooldownMaxSec=15
; 1 = the target runs away while being chased (FleeSpeed 1.0 = slow, 3.0 = full sprint)
TargetFlees=0
FleeSpeed=1.0
SpeechParams=force_shouted_critical
LassoerLines=HOGTIES_MALE,HOGTIES_FEMALE,CHALLENGE_THREATEN
TargetLines=PLEAD,GENERIC_FRIGHTENED_HIGH,SCARED_HELP

[UI]
; bg = current text natives (_BG_DISPLAY_TEXT), legacy = old natives if the menu stays invisible
TextBackend=bg
X=0.02
Y=0.12
Width=0.27
TextScale=0.38
